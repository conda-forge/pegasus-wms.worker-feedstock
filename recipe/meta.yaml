{% set name = "pegasus-wms.worker" %}
{% set version = "5.1.1" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pegasus_wms_worker-{{ version }}.tar.gz
  sha256: b33382c28b5d5eb58950d4e37acfffb2780eaf521e1749f54c5c6c351d74dd6c
  patches:
    # https://github.com/pegasus-isi/pegasus/pull/27
    - 0001-pegasus-worker-use-implicit-namespace-packages.patch

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools <69
    - wheel
  run:
    - boto3 >1.12
    - globus-sdk >=3.23.0
    - python >={{ python_min }}
    - six >=1.9.0

test:
  requires:
    - pip
    - python {{ python_min }}
  imports:
    - Pegasus.tools.worker_utils
  commands:
    # check requirements
    - python -m pip check
    # check cli
    - python -m Pegasus.cli.pegasus-globus-online-init --help
    - python -m Pegasus.cli.pegasus-globus-online --help
    - python -m Pegasus.cli.pegasus-integrity --help
    - python -m Pegasus.cli.pegasus-transfer --help

about:
  home: https://pegasus.isi.edu
  dev_url: https://github.com/pegasus-isi/pegasus.git
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Pegasus Workflow Management System Python API

extra:
  recipe-maintainers:
    - duncanmmacleod
